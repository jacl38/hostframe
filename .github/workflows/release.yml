name: Linux x64 release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: fedora:44
    defaults:
      run:
        shell: bash
    env:
      HOSTFRAME_JOBS: "2"
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - name: Install native and test prerequisites
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            bash binutils ca-certificates curl git gzip tar unzip nodejs \
            gcc gcc-c++ cmake ninja-build python3 pkgconf-pkg-config \
            libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel \
            libXi-devel libXext-devel libXfixes-devel \
            vulkan-loader mesa-vulkan-drivers xorg-x11-server-Xvfb xorg-x11-xauth \
            kwin-x11 xdotool xprop ImageMagick dbus-daemon
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Check version tag
        run: bun run release:check
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build pinned native inputs
        run: bun run setup
      - name: Lint, typecheck, and test
        run: |
          bun run lint
          bun run typecheck
          bun test scripts packages/core/test
      - name: Verify desktop failure and cancellation cleanup
        run: bun scripts/validation/desktop-check.ts
      - name: Verify native presentation
        run: bun scripts/validation/desktop.ts bun scripts/native.ts verify --window-interactions
      - name: Verify full gallery and composition output
        run: |
          bun scripts/validation/desktop.ts bun scripts/examples.ts --verify
          bun scripts/validation/desktop.ts node scripts/validation/renderer-output.ts
          bun scripts/validation/desktop.ts bun scripts/validation/renderer-output.ts
      - name: Verify packed consumers
        run: bun scripts/validation/desktop.ts bun scripts/package/verify.ts
      - name: Prepare release assets
        run: bun run release:prepare
      - name: Upload desktop diagnostics
        if: always()
        # v4's artifact protocol also works with act's local artifact server.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-diagnostics
          path: |
            build/validation/desktop-*/*.log
            build/validation/desktop-*/*.stderr
            build/validation/desktop-*/*.json
            build/validation/desktop-*/*.png
            build/validation/desktop-*/captures/*.png
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Upload verified assets
        # v4's artifact protocol also works with act's local artifact server.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostframe-linux-x64
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    name: Create draft GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: hostframe-linux-x64
          path: build/release/
      - name: Create draft with verified assets
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:draft
