name: Native release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/jacl38/hostframe-ci@sha256:e1e2649bd8e8603573ebe8f20fcb549885b654bc91d38efe71350791591a1f00
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      HOSTFRAME_JOBS: "2"
      HOSTFRAME_X11_WM: openbox
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Check version tag
        run: bun run release:check
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Cache checksum-verified native archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/native/downloads/
          key: native-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native/dawn.lock.json') }}
      - name: Cache native compiler results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/native/cache/ccache
          key: ccache-fedora44-e1e2649b-${{ runner.arch }}-${{ hashFiles('scripts/native/dawn.lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-fedora44-e1e2649b-${{ runner.arch }}-${{ hashFiles('scripts/native/dawn.lock.json') }}-
      - name: Build pinned native inputs
        run: bun run setup
      - name: Lint, typecheck, and test
        run: |
          bun run lint
          bun run typecheck
          bun test scripts packages/core/test
      - name: Verify desktop failure and cancellation cleanup
        run: bun scripts/validation/desktop-check.ts
      - name: Verify Hostframe system contracts and library adapters
        run: bun run test:system
      - name: Verify packed consumers
        run: bun scripts/validation/desktop.ts bun scripts/package/verify.ts
      - name: Verify forced cleanup timeouts in both runtimes
        run: |
          HOSTFRAME_TEST_CLEANUP_TIMEOUT=1 bun run native:build
          HOSTFRAME_TEST_CLEANUP_TIMEOUT=1 bun scripts/validation/desktop.ts bun scripts/native.ts verify --cleanup-timeouts-only
      - name: Prepare release assets
        run: bun run release:prepare
      - name: Upload desktop diagnostics
        if: always()
        # v4's artifact protocol also works with act's local artifact server.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-diagnostics
          path: |
            build/validation/lifecycle-*/*.log
            build/validation/lifecycle-*/*.stderr
            build/validation/desktop-*/*.log
            build/validation/desktop-*/*.stderr
            build/validation/desktop-*/*.json
            build/validation/desktop-*/*.png
            build/validation/desktop-*/captures/*.png
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Upload verified assets
        # v4's artifact protocol also works with act's local artifact server.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostframe-linux-x64
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    name: Create draft GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: hostframe-linux-x64
          path: build/release/
      - name: Create draft with verified assets
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:draft

  macos:
    name: Build and verify macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - run: brew install cmake ninja
      - run: bun run release:check
      - run: bun install --frozen-lockfile
      - name: Cache checksum-verified native archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/native/downloads/
          key: native-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native/dawn.lock.json') }}
      - run: bun run setup
      - run: |
          bun run lint
          bun run typecheck
          bun run test
      - run: bun run native:verify --presentation
      - run: bun run package:verify
      - run: bun run release:prepare
      - name: Upload verified macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostframe-darwin-arm64
          path: build/release-macos/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attach-macos:
    name: Attach verified macOS assets to draft
    needs: [macos, draft-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: hostframe-darwin-arm64
          path: build/release/macos/
      - name: Attach checksum-verified assets
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release/assets.ts attach-macos
