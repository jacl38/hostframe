name: macOS release runner probe

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source tag or commit to build
        required: true
        default: v0.1.0-alpha.6

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - run: brew install cmake ninja
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun run native:verify --presentation
      - run: bun run package:verify
      - run: bun run release:prepare
      - name: Upload verified macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostframe-darwin-arm64-${{ matrix.runner }}
          path: build/release-macos/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
