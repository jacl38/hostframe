name: Windows native development

on:
  push:
    branches: [windows-native-45]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Inspect Windows runner
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check native source audit on Windows
        run: bun test scripts/native/native.test.ts --test-name-pattern "build audit"
      - name: Check pinned engine selection
        run: bun test scripts/native/native.test.ts --test-name-pattern "engine|unsupported"
      - name: Inspect operating system and graphics
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture | Format-List
          $adapters = @(Get-CimInstance Win32_VideoController)
          Write-Output "Detected video controllers: $($adapters.Count)"
          $adapters | Select-Object Name, DriverVersion, Status | Format-List
          cmake --version
          ninja --version
          node --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
      - name: Download Node import library
        shell: pwsh
        run: |
          Invoke-WebRequest https://nodejs.org/dist/v26.7.0/win-x64/node.lib -OutFile node.lib
          if ((Get-FileHash node.lib -Algorithm SHA256).Hash -ne "56f06350037085fce04930befd98327afc86ee46f52af6f6f8a68a03630e8380") { throw "Node import library checksum mismatch" }
      - name: Build experimental native addon
        shell: cmd
        env:
          HOSTFRAME_EXPERIMENTAL_WINDOWS: "1"
          CC: clang
          CXX: clang++
          HOSTFRAME_NODE_LIBRARY: ${{ github.workspace }}\node.lib
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          bun run setup
      # Diagnostic only: the SDK DLL is not the pinned Dawn DEPS revision and
      # must not be used as a release input.
      - name: Install runner shader compiler for diagnostics
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64"
          Copy-Item "$sdk\dxcompiler.dll" build/native/cmake/
          Copy-Item "$sdk\dxil.dll" build/native/cmake/
      - name: Probe Node GPU availability
        continue-on-error: true
        run: node packages/native/test/headless.ts
      - name: Check application thread guard
        continue-on-error: true
        run: |
          node packages/native/test/window.ts --thread-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun packages/native/test/window.ts --thread-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows runtimes
        run: bun run native:verify
      - name: Probe native input fixture
        continue-on-error: true
        run: ./build/native/cmake/native_input_check.exe
      - name: Probe window lifecycle
        continue-on-error: true
        run: node packages/native/test/key-labels.ts
      - name: Probe surface presentation
        continue-on-error: true
        run: ./build/native/cmake/native_presentation_check.exe
      - name: Verify Windows presentation and lifecycle
        run: bun run native:verify --presentation
