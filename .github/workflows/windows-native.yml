name: Windows native development

on:
  push:
    branches: [windows-native-45]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Inspect Windows runner
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check native source audit on Windows
        run: bun test scripts/native/native.test.ts --test-name-pattern "build audit"
      - name: Check pinned engine selection
        run: bun test scripts/native/native.test.ts --test-name-pattern "engine|unsupported"
      - name: Inspect operating system and graphics
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture | Format-List
          $adapters = @(Get-CimInstance Win32_VideoController)
          Write-Output "Detected video controllers: $($adapters.Count)"
          $adapters | Select-Object Name, DriverVersion, Status | Format-List
          cmake --version
          ninja --version
          node --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
      - name: Build experimental native addon
        shell: cmd
        env:
          HOSTFRAME_EXPERIMENTAL_WINDOWS: "1"
          CC: clang
          CXX: clang++
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          bun run setup
