name: Continuous validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    needs: checks
    if: needs.checks.outputs.integration == 'true'
    name: Build and verify macOS arm64
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install build prerequisites
        run: brew install cmake ninja
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build pinned native inputs
        run: bun run setup
      - name: Check TypeScript and tests
        run: |
          bun run lint
          bun run typecheck
          bun run test
      - name: Verify compute, lifecycle, and presentation
        run: bun run native:verify --presentation
      - name: Verify packed consumers
        run: bun run package:verify
      - name: Verify macOS release asset preparation
        run: bun run release:prepare
      - name: Inspect deployment target
        run: |
          vtool -show-build build/native/cmake/hostframe.node
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos15-deployment-prototype
          path: build/release-macos/
          if-no-files-found: error

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Classify integration changes
        id: changes
        env:
          HOSTFRAME_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/validation/changes.ts
      - run: bun run lint
      - name: Test build-independent changes
        if: steps.changes.outputs.integration != 'true'
        run: bun test scripts/native/native.test.ts scripts/native/generate.test.ts scripts/native/input-constants.test.ts scripts/release scripts/validation packages/core/test/loop.test.ts packages/core/test/timing.test.ts

  build:
    needs: checks
    if: needs.checks.outputs.integration == 'true'
    name: Build and verify Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/jacl38/hostframe-ci@sha256:e1e2649bd8e8603573ebe8f20fcb549885b654bc91d38efe71350791591a1f00
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      HOSTFRAME_JOBS: "2"
      HOSTFRAME_X11_WM: openbox
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Cache checksum-verified native archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/native/downloads/
          key: native-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native/dawn.lock.json') }}
      - name: Cache native compiler results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/native/cache/ccache
          key: ccache-fedora44-e1e2649b-${{ runner.arch }}-${{ hashFiles('scripts/native/dawn.lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-fedora44-e1e2649b-${{ runner.arch }}-${{ hashFiles('scripts/native/dawn.lock.json') }}-
      - name: Build pinned native inputs
        run: bun run setup
      - name: Typecheck and test
        run: |
          bun run typecheck
          bun test scripts packages/core/test
      - name: Verify desktop failure and cancellation cleanup
        run: bun scripts/validation/desktop-check.ts
      - name: Verify Hostframe system contracts and library adapters
        run: bun scripts/validation/desktop.ts bun scripts/validation/system.ts
      - name: Check example gallery maintenance
        if: github.event_name == 'workflow_dispatch'
        run: bun scripts/validation/desktop.ts bun scripts/examples.ts --verify
      - name: Verify packed consumers
        run: bun scripts/validation/desktop.ts bun scripts/package/verify.ts
      - name: Verify forced cleanup timeouts in both runtimes
        run: |
          HOSTFRAME_TEST_CLEANUP_TIMEOUT=1 bun run native:build
          HOSTFRAME_TEST_CLEANUP_TIMEOUT=1 bun scripts/validation/desktop.ts bun scripts/native.ts verify --cleanup-timeouts-only
      - name: Upload desktop diagnostics
        if: always()
        # v4's artifact protocol also works with act's local artifact server.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-diagnostics
          path: |
            build/validation/lifecycle-*/*.log
            build/validation/lifecycle-*/*.stderr
            build/validation/desktop-*/*.log
            build/validation/desktop-*/*.stderr
            build/validation/desktop-*/*.json
            build/validation/desktop-*/*.png
            build/validation/desktop-*/captures/*.png
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
