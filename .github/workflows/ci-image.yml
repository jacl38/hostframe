name: Build CI image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/container/Dockerfile
      - .github/workflows/ci-image.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CI image
        id: image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v7
        with:
          context: .
          file: .github/container/Dockerfile
          push: true
          tags: ghcr.io/jacl38/hostframe-ci:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/jacl38/hostframe
      - name: Report immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/jacl38/hostframe-ci@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
